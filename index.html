<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жаңа жыл құтты болсын! / С Новым годом!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      /* Праздничный хвойно-сапфировый градиент с золотым сиянием в центре */
      background: 
        radial-gradient(circle at 50% 30%, rgba(255, 215, 0, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(220, 38, 38, 0.18) 0%, transparent 55%),
        linear-gradient(145deg, #06241b 0%, #0a192f 50%, #0b1320 100%);
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 24px;
    }

    /* Праздничные огоньки на фоне */
    .glow-light {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .light-1 {
      width: 260px;
      height: 260px;
      top: 5%;
      left: 10%;
      background: rgba(253, 224, 71, 0.16);
    }
    .light-2 {
      width: 320px;
      height: 320px;
      bottom: 5%;
      right: 10%;
      background: rgba(56, 189, 248, 0.18);
      animation-delay: -3s;
    }
    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0.9; }
    }

    /* Анимация падающего снега */
    .snowflake {
      position: fixed;
      top: -20px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      opacity: 0.85;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
    }

    /* Новогодняя стеклянная карточка */
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 30px;
      padding: 44px 28px;
      text-align: center;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 2px rgba(255, 255, 255, 0.45),
        0 0 40px rgba(255, 215, 0, 0.15);
      z-index: 2;
    }
    .badge {
      display: inline-block;
      font-size: 2.6rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 14px rgba(255, 215, 0, 0.6));
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    .subtitle {
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 32px;
      font-weight: 400;
      line-height: 1.5;
    }
    .buttons-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Кнопки переходов */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 17px 22px;
      font-size: 1.08rem;
      font-weight: 700;
      text-decoration: none;
      color: #ffffff;
      border-radius: 18px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .btn-kz {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(125, 211, 252, 0.5);
    }
    .btn-kz:hover, .btn-kz:active {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(2, 132, 199, 0.5);
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
    }
    .btn-ru {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      border: 1px solid rgba(252, 165, 165, 0.5);
    }
    .btn-ru:hover, .btn-ru:active {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(220, 38, 38, 0.5);
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }
    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .footer-note {
      margin-top: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Огоньки гирлянды на фоне -->
  <div class="glow-light light-1"></div>
  <div class="glow-light light-2"></div>

  <!-- Падающий снег -->
  <div class="snowflake" style="left: 8%; animation-duration: 9s; font-size: 1.1rem;">❄</div>
  <div class="snowflake" style="left: 22%; animation-duration: 13s; animation-delay: 2s; font-size: 1.4rem;">❅</div>
  <div class="snowflake" style="left: 38%; animation-duration: 8s; animation-delay: 4s; font-size: 0.9rem;">❆</div>
  <div class="snowflake" style="left: 55%; animation-duration: 11s; animation-delay: 1s; font-size: 1.3rem;">❄</div>
  <div class="snowflake" style="left: 72%; animation-duration: 14s; animation-delay: 3s; font-size: 1.1rem;">❅</div>
  <div class="snowflake" style="left: 88%; animation-duration: 10s; animation-delay: 5s; font-size: 1rem;">❆</div>
  <div class="snowflake" style="left: 95%; animation-duration: 12s; animation-delay: 2.5s; font-size: 1.5rem;">❄</div>

  <div class="card">
    <div class="badge">🎄✨</div>
    <h1>Жаңа жыл құтты болсын!</h1>
    <p class="subtitle">Тілді таңдаңыз / Выберите язык видеоқұттықтау:</p>

    <div class="buttons-wrap">
      <!-- Қазақша -->
      <a href="https://youtube.com/shorts/4BTTCMMKcuE?feature=share" target="_blank" rel="noopener noreferrer" class="btn btn-kz">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Қазақша
      </a>

      <!-- Русский -->
      <a href="https://youtube.com/shorts/zNhcPhazkL8" target="_blank" rel="noopener noreferrer" class="btn btn-ru">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Русский
      </a>
    </div>

    <div class="footer-note">2027 🌟</div>
  </div>

</body>
</html>
