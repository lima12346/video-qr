<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жаңа жыл құтты болсын! / С Новым годом!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b2838 0%, #0d131a 100%);
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 24px;
    }
    /* Анимация падающего снега */
    .snowflake {
      position: fixed;
      top: -10px;
      color: #fff;
      font-size: 1.2rem;
      opacity: 0.8;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
    }
    /* Стеклянная новогодняя карточка */
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 44px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      z-index: 2;
    }
    .badge {
      display: inline-block;
      font-size: 2.4rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 10px rgba(255, 215, 0, 0.4));
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 32px;
      font-weight: 400;
    }
    .buttons-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* Кнопки переходов */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      color: #ffffff;
      border-radius: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .btn-kz {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .btn-kz:hover, .btn-kz:active {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(2, 132, 199, 0.4);
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
    }
    .btn-ru {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      border: 1px solid rgba(248, 113, 113, 0.4);
    }
    .btn-ru:hover, .btn-ru:active {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(220, 38, 38, 0.4);
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }
    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .footer-note {
      margin-top: 30px;
      font-size: 0.78rem;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Снежинки -->
  <div class="snowflake" style="left: 10%; animation-duration: 9s; font-size: 1rem;">❄</div>
  <div class="snowflake" style="left: 25%; animation-duration: 13s; animation-delay: 2s;">❅</div>
  <div class="snowflake" style="left: 45%; animation-duration: 8s; animation-delay: 4s; font-size: 0.9rem;">❆</div>
  <div class="snowflake" style="left: 65%; animation-duration: 11s; animation-delay: 1s;">❄</div>
  <div class="snowflake" style="left: 80%; animation-duration: 14s; animation-delay: 3s; font-size: 1.1rem;">❅</div>
  <div class="snowflake" style="left: 92%; animation-duration: 10s; animation-delay: 5s;">❆</div>

  <div class="card">
    <div class="badge">🎄✨</div>
    <h1>Жаңа жыл құтты болсын!</h1>
    <p class="subtitle">Тілді таңдаңыз / Выберите язык видеоқұттықтау:</p>

    <div class="buttons-wrap">
      <!-- Кнопка Қазақша: вставьте свою ссылку в href -->
      <a href="https://youtube.com/shorts/4BTTCMMKcuE?feature=share" target="_blank" rel="noopener noreferrer" class="btn btn-kz">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Қазақша
      </a>

      <!-- Кнопка Русский: вставьте свою ссылку в href -->
      <a href="https://youtube.com/shorts/zNhcPhazkL8" target="_blank" rel="noopener noreferrer" class="btn btn-ru">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Русский
      </a>
    </div>

    <div class="footer-note">2027 🌟</div>
  </div>

</body>
</html>
