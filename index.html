<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жаңа жыл құтты болсын! / С Новым годом!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 24px;
      background-color: #0b1320;
    }

    /* Фоновое фото из репозитория */
    .bg2-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(10, 25, 47, 0.55), rgba(5, 12, 22, 0.75)),
        url('bg2.jpg');
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    /* Анимация снега */
    .snowflake {
      position: fixed;
      top: -20px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
      opacity: 0.85;
      pointer-events: none;
      animation: fall linear infinite;
      z-index: 3;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
    }

    /* Стеклянная карточка */
    .card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 30px;
      padding: 44px 26px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      z-index: 4;
    }
    .badge {
      display: inline-block;
      font-size: 3.2rem;
      margin-bottom: 14px;
      filter: drop-shadow(0 6px 16px rgba(1, 161, 229, 0.35));
    }
    .main-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 30px;
      font-weight: 400;
      line-height: 1.4;
    }
    .buttons-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Базовый стиль кнопок */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 17px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      color: #ffffff;
      border-radius: 18px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      letter-spacing: 0.2px;
    }

    /* Кнопка Жаңа жыл құтты болсын! (#01a1e5) */
    .btn-kz {
      background: linear-gradient(135deg, #01a1e5 0%, #0077ab 100%);
      border: 1px solid rgba(1, 161, 229, 0.7);
    }
    .btn-kz:hover, .btn-kz:active {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(1, 161, 229, 0.55);
      background: linear-gradient(135deg, #1cb4f8 0%, #01a1e5 100%);
    }

    /* Кнопка С Новым годом! (#b59016) */
    .btn-ru {
      background: linear-gradient(135deg, #b59016 0%, #856708 100%);
      border: 1px solid rgba(220, 180, 50, 0.7);
    }
    .btn-ru:hover, .btn-ru:active {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(181, 144, 22, 0.55);
      background: linear-gradient(135deg, #caa31e 0%, #b59016 100%);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .footer-note {
      margin-top: 28px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Фоновое изображение -->
  <div class="bg-image"></div>

  <!-- Падающий снег -->
  <div class="snowflake" style="left: 8%; animation-duration: 9s; font-size: 1.1rem;">❄</div>
  <div class="snowflake" style="left: 22%; animation-duration: 13s; animation-delay: 2s; font-size: 1.4rem;">❅</div>
  <div class="snowflake" style="left: 38%; animation-duration: 8s; animation-delay: 4s; font-size: 0.9rem;">❆</div>
  <div class="snowflake" style="left: 55%; animation-duration: 11s; animation-delay: 1s; font-size: 1.3rem;">❄</div>
  <div class="snowflake" style="left: 72%; animation-duration: 14s; animation-delay: 3s; font-size: 1.1rem;">❅</div>
  <div class="snowflake" style="left: 88%; animation-duration: 10s; animation-delay: 5s; font-size: 1rem;">❆</div>
  <div class="snowflake" style="left: 95%; animation-duration: 12s; animation-delay: 2.5s; font-size: 1.5rem;">❄</div>

  <div class="card">
    <div class="badge">🚂</div>

    <div class="main-title">Бейнеқұттықтау / Видеопоздравление</div>
    
    <div class="buttons-wrap">
      <a href="https://youtube.com/shorts/4BTTCMMKcuE?feature=share" target="_blank" rel="noopener noreferrer" class="btn btn-kz">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Жаңа жыл құтты болсын!
      </a>

      <a href="https://youtube.com/shorts/zNhcPhazkL8" target="_blank" rel="noopener noreferrer" class="btn btn-ru">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        С Новым годом!
      </a>
    </div>

    <div class="footer-note">2027</div>
  </div>

</body>
</html>
